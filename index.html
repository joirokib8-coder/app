<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub BD</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            padding: 15px;
        }
        .header {
            background: #1e1e1e;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 16px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .video-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .video-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .video-title {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        🎬 Movie Hub BD
    </div>

    <!-- সার্চ বক্স -->
    <input type="text" class="search-box" id="searchInput" placeholder="ভিডিও খুঁজুন..." onkeyup="searchVideos()">

    <h3 style="font-size: 15px; margin-bottom: 10px;">সকল ভিডিও</h3>
    <div id="videoContainer"></div>

    <script>
        // একই ডোমেইন বা ফোল্ডারে থাকার কারণে এই কমন চাবি (Key) দিয়ে দুই ফাইল যুক্ত থাকবে
        const STORAGE_KEY = 'movieHub_secure_sync_key';

        window.onload = function() {
            loadWebsiteVideos();
            // অটো সিঙ্ক যাতে অ্যাডমিন থেকে ভিডিও দিলে এখানে সাথে সাথে চলে আসে
            window.addEventListener('storage', function(e) {
                if (e.key === STORAGE_KEY) {
                    loadWebsiteVideos();
                }
            });
        };

        function loadWebsiteVideos() {
            let container = document.getElementById('videoContainer');
            container.innerHTML = '';
            let videos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            if(videos.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; margin-top:30px;">বর্তমানে কোনো ভিডিও নেই।</p>';
                return;
            }

            videos.forEach((vid) => {
                let card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = function() {
                    playVideoWithAd(vid.videoUrl);
                };
                card.innerHTML = `
                    <img src="${vid.imgSrc}" alt="Thumbnail">
                    <div class="video-title">${vid.title}</div>
                `;
                container.appendChild(card);
            });
        }

        function playVideoWithAd(url) {
            if (typeof show_11978077 === 'function') {
                show_11978077().then(() => {
                    window.location.href = url;
                }).catch(() => {
                    window.location.href = url;
                });
            } else {
                window.location.href = url;
            }
        }

        function searchVideos() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('video-card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByClassName('video-title')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
