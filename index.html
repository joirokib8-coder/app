

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub BD</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --text-color: #ffffff;
            --card-bg: #1a1c23;
            --accent-color: #e91e63;
            --secondary-text: #b0b0b0;
        }
        [data-theme="light"] {
            --bg-color: #f4f5f7;
            --text-color: #111111;
            --card-bg: #ffffff;
            --accent-color: #e91e63;
            --secondary-text: #666666;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            padding-bottom: 95px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button, select {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .container {
            padding: 15px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
        }
        .banner {
            width: 100%;
            height: 160px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .banner::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            z-index: 1;
        }
        .banner span {
            position: relative;
            z-index: 2;
        }
        .section-title {
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            position: relative;
        }
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .card-body {
            padding: 10px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-sub {
            font-size: 11px;
            color: var(--secondary-text);
            margin-bottom: 8px;
        }
        .watch-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background: var(--accent-color);
            color: white;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            box-sizing: border-box;
            cursor: pointer;
        }
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            font-size: 12px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #timerModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        #videoPlayerModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 4000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .player-container {
            width: 100%;
            max-width: 600px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .player-container video {
            width: 100%;
            height: 300px;
            border: none;
            display: block;
        }
        .close-player {
            background: #e91e63;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        #adminModal, #uploadPanelModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .admin-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 350px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .admin-box input, .admin-box select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .admin-box label {
            font-size: 12px;
            color: #bbb;
            display: block;
            margin-bottom: 4px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--secondary-text);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .nav-item span {
            font-size: 20px;
        }
        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo" id="appTitle">Movie Hub BD</div>
        <div class="header-controls">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="bn">বাংলা</option>
                <option value="en">English</option>
            </select>
            <button onclick="toggleTheme()">🌓 থিম</button>
            <button onclick="openAdminLogin()" style="background:#444; font-size:12px; padding:7px 8px;">⚙️</button>
        </div>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="নাটক বা সিনেমা খুঁজুন..." onkeyup="searchMovies()">

        <!-- অটো ব্যানার -->
        <div class="banner" id="bannerBox" onclick="clickBanner()" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://via.placeholder.com/600x300');">
            <span id="bannerText">Movie Hub BD - নতুন মুভি ও নাটক দেখুন</span>
        </div>

        <div class="section-title" id="secTitle">জনপ্রিয় সিরিজ ও নাটক</div>

        <div class="grid" id="videoGrid">
            <!-- ভিডিও কার্ডগুলো এখানে স্বয়ংক্রিয়ভাবে লোড হবে -->
        </div>
    </div>

    <!-- ১৫ সেকেন্ড টাইমার -->
    <div id="timerModal">
        <h2 style="color: var(--accent-color); margin-bottom: 10px;">বিজ্ঞাপন ও প্রিপারেশন চলছে...</h2>
        <p style="font-size: 14px; color: #ccc; margin-bottom: 20px;">দয়া করে একটু অপেক্ষা করুন, ভিডিও প্রস্তুত হচ্ছে:</p>
        <h1 id="countdownNumber" style="font-size: 50px; margin: 0; color: #ffeb3b;">15</h1>
    </div>

    <!-- ইন-অ্যাপ ভিডিও প্লেয়ার -->
    <div id="videoPlayerModal">
        <div class="player-container">
            <div id="playerWrapper"></div>
        </div>
        <button class="close-player" onclick="closeVideoPlayer()">ভিডিও বন্ধ করুন</button>
    </div>

    <!-- অ্যাডমিন লগইন -->
    <div id="adminModal">
        <div class="admin-box">
            <h3 style="margin-top:0; color:var(--accent-color);">অ্যাডমিন লগইন</h3>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড (1234)">
            <button onclick="checkAdmin()" style="width:100%; margin-bottom:5px;">লগইন করুন</button>
            <button onclick="closeAdmin()" style="width:100%; background:#555;">বন্ধ করুন</button>
        </div>
    </div>

    <!-- ভিডিও ও থাম্বনেইল আপলোড প্যানেল -->
    <div id="uploadPanelModal">
        <div class="admin-box">
            <h3 style="margin-top:0; color:var(--accent-color);">ভিডিও আপলোড প্যানেল</h3>

            <label>ক্যাটাগরি:</label>
            <select id="newCategory">
                <option value="drama">সিরিজ ও নাটক</option>
                <option value="tv">টিভি শো</option>
            </select>

            <label>নাটক বা মুভির নাম (ক্যাপশন):</label>
            <input type="text" id="newTitle" placeholder="যেমন: নতুন নাটক পর্ব ১">

            <label>সংক্ষিপ্ত বিবরণ:</label>
            <input type="text" id="newSub" placeholder="যেমন: ফুল এইচডি ভিডিও">

            <label>থাম্বনেইল ছবি আপলোড করুন:</label>
            <input type="file" id="newImgFile" accept="image/*" style="background:#222; padding:8px; border-radius:5px; margin-bottom:10px; color:#fff; width:100%; box-sizing:border-box;">

            <label>ভিডিওর ডাইরেক্ট লিংক (.mp4):</label>
            <input type="text" id="newLink" placeholder="ভিডিও ফাইল বা স্ট্রিম লিংক দিন">

            <button onclick="addNewVideo()" style="width:100%; margin-bottom:5px; background:#4CAF50;">পাবলিশ করুন</button>
            <button onclick="closeUploadPanel()" style="width:100%; background:#555;">প্যানেল বন্ধ করুন</button>
        </div>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="filterTab('home', this)"><span>🏠</span>হোম</div>
        <div class="nav-item" onclick="filterTab('drama', this)"><span>🎬</span>সিরিজ</div>
        <div class="nav-item" onclick="filterTab('tv', this)"><span>📺</span>টিভি</div>
        <div class="nav-item" onclick="filterTab('favorite', this)"><span>❤️</span>ফেভারিট</div>
        <div class="nav-item" onclick="filterTab('profile', this)"><span>👤</span>প্রফাইল</div>
    </div>

    <script>
        let currentBannerLink = 'https://omg10.com/4/11896491';

        // পেজ লোড হওয়ার সাথে সাথে সেভ করা ভিডিওগুলো ডিসপ্লেতে নিয়ে আসা
        window.onload = function() {
            loadVideos();
        };

        function clickBanner() {
            window.open(currentBannerLink, '_blank');
        }

        function startAdTimer(videoUrl) {
            const modal = document.getElementById('timerModal');
            const countDisplay = document.getElementById('countdownNumber');
            modal.style.display = 'flex';

            window.open('https://wwp.giriuhot.com/redirect-zone/47d42437', '_blank');

            let timeLeft = 15;
            countDisplay.innerText = timeLeft;

            let timer = setInterval(function() {
                timeLeft--;
                countDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    modal.style.display = 'none';
                    openInAppPlayer(videoUrl);
                }
            }, 1000);
        }

        function openInAppPlayer(url) {
            const playerModal = document.getElementById('videoPlayerModal');
            const wrapper = document.getElementById('playerWrapper');

            wrapper.innerHTML = `<video controls autoplay style="width:100%; height:300px;"><source src="${url}" type="video/mp4">আপনার ব্রাউজার ভিডিও সাপোর্ট করছে না।</video>`;
            playerModal.style.display = 'flex';
        }

        function closeVideoPlayer() {
            const playerModal = document.getElementById('videoPlayerModal');
            const wrapper = document.getElementById('playerWrapper');
            wrapper.innerHTML = '';
            playerModal.style.display = 'none';
        }

        function openAdminLogin() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkAdmin() {
            let pass = document.getElementById('adminPass').value;
            if(pass === '1234') {
                closeAdmin();
                document.getElementById('uploadPanelModal').style.display = 'flex';
            } else {
                alert('ভুল পাসওয়ার্ড! (1234 দিন)');
            }
        }

        function closeUploadPanel() {
            document.getElementById('uploadPanelModal').style.display = 'none';
        }

        function addNewVideo() {
            let category = document.getElementById('newCategory').value;
            let title = document.getElementById('newTitle').value;
            let sub = document.getElementById('newSub').value;
            let link = document.getElementById('newLink').value;
            let imgFileInput = document.getElementById('newImgFile');

            if(title && link) {
                let reader = new FileReader();

                if (imgFileInput.files && imgFileInput.files[0]) {
                    reader.onload = function(e) {
                        saveVideoData(category, title, sub, e.target.result, link);
                    }
                    reader.readAsDataURL(imgFileInput.files[0]);
                } else {
                    saveVideoData(category, title, sub, 'https://via.placeholder.com/300x150', link);
                }
            } else {
                alert('দয়া করে নাম এবং ভিডিও লিংক দিন!');
            }
        }

        function saveVideoData(category, title, sub, imgSrc, link) {
            let videos = JSON.parse(localStorage.getItem('movieHubVideos')) || [];
            let newVid = { category, title, sub, imgSrc, link };
            videos.unshift(newVid); // নতুন ভিডিও সবার উপরে দেখাবে
            localStorage.setItem('movieHubVideos', JSON.stringify(videos));

            loadVideos();
            closeUploadPanel();
            alert('সফলভাবে পাবলিশ করা হয়েছে!');

            document.getElementById('newTitle').value = '';
            document.getElementById('newSub').value = '';
            document.getElementById('newLink').value = '';
            document.getElementById('newImgFile').value = '';
        }

        function loadVideos() {
            let grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            let videos = JSON.parse(localStorage.getItem('movieHubVideos')) || [];

            // যদি কোনো ভিডিও না থাকে তবে ডিফল্ট একটি ডেমো ভিডিও দেখাবে
            if(videos.length === 0) {
                videos = [{
                    category: 'drama',
                    title: 'নাটক ১',
                    sub: 'মজার কমেডি নাটক',
                    imgSrc: 'https://via.placeholder.com/300x150',
                    link: 'https://www.w3schools.com/html/mov_bbb.mp4'
                }];
            }

            videos.forEach((vid, index) => {
                let newCard = document.createElement('div');
                newCard.className = 'card';
                newCard.setAttribute('data-category', vid.category);
                newCard.setAttribute('data-title', vid.title.toLowerCase());

                newCard.innerHTML = `
                    <button class="delete-btn" onclick="deleteVideo(${index})" title="ডিলিট করুন">X</button>
                    <img src="${vid.imgSrc}" alt="Thumbnail">
                    <div class="card-body">
                        <div class="card-title">${vid.title}</div>
                        <div class="card-sub">${vid.sub}</div>
                        <button class="watch-btn" onclick="startAdTimer('${vid.link}')">ভিডিও দেখুন</button>
                    </div>
                `;
                grid.appendChild(newCard);
            });

            // ব্যানার আপডেট
            if(videos.length > 0) {
                let bannerBox = document.getElementById('bannerBox');
                let bannerText = document.getElementById('bannerText');
                bannerBox.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('${videos[0].imgSrc}')`;
                bannerText.innerText = videos[0].title + " - এখন অ্যাপে উপলব্ধ!";
            }
        }

        function deleteVideo(index) {
            if(confirm('আপনি কি এই ভিডিওটি ডিলিট করতে চান?')) {
                let videos = JSON.parse(localStorage.getItem('movieHubVideos')) || [];
                videos.splice(index, 1);
                localStorage.setItem('movieHubVideos', JSON.stringify(videos));
                loadVideos();
            }
        }

        function filterTab(type, element) {
            let items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            let cards = document.getElementsByClassName('card');
            let secTitle = document.getElementById('secTitle');

            if(type === 'home') {
                secTitle.innerText = "জনপ্রিয় সিরিজ ও নাটক";
                for(let card of cards) { card.style.display = ""; }
            } else if(type === 'drama') {
                secTitle.innerText = "সিরিজ ও নাটক তালিকা";
                for(let card of cards) {
                    card.style.display = (card.getAttribute('data-category') === 'drama') ? "" : "none";
                }
            } else if(type === 'tv') {
                secTitle.innerText = "টিভি শো ও লাইভ";
                for(let card of cards) {
                    card.style.display = (card.getAttribute('data-category') === 'tv') ? "" : "none";
                }
            } else if(type === 'favorite') {
                alert('ফেভারিট লিস্ট খালি!');
            } else if(type === 'profile') {
                alert('Movie Hub BD | অ্যাডমিন প্যানেল খুলতে উপরে ⚙️ আইকনে চাপুন।');
            }
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            if(lang === 'en') {
                document.getElementById('secTitle').innerText = 'Popular Series & Dramas';
                document.getElementById('searchInput').placeholder = 'Search movies or dramas...';
            } else {
                document.getElementById('secTitle').innerText = 'জনপ্রিয় সিরিজ ও নাটক';
                document.getElementById('searchInput').placeholder = 'নাটক বা সিনেমা খুঁজুন...';
            }
        }

        function searchMovies() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title').toLowerCase();
                cards[i].style.display = title.includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
