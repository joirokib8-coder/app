<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub BD</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --text-color: #ffffff;
            --card-bg: #1a1c23;
            --accent-color: #e91e63;
            --secondary-text: #b0b0b0;
        }
        [data-theme="light"] {
            --bg-color: #f4f5f7;
            --text-color: #111111;
            --card-bg: #ffffff;
            --accent-color: #e91e63;
            --secondary-text: #666666;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            padding-bottom: 70px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .header-controls {
            display: flex;
            gap: 10px;
        }
        button, select {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .container {
            padding: 15px;
        }
        /* সার্চ বক্স */
        .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
        }
        .banner {
            width: 100%;
            height: 160px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }
        .card-body {
            padding: 10px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-sub {
            font-size: 11px;
            color: var(--secondary-text);
            margin-bottom: 8px;
        }
        .watch-btn {
            display: block;
            width: 100%;
            padding: 6px;
            background: var(--accent-color);
            color: white;
            text-align: center;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            box-sizing: border-box;
        }
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-item {
            text-align: center;
            font-size: 11px;
            color: var(--secondary-text);
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo" id="appTitle">Movie Hub BD</div>
        <div class="header-controls">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="bn">বাংলা</option>
                <option value="en">English</option>
            </select>
            <button onclick="toggleTheme()">🌓 থিম</button>
        </div>
    </header>

    <div class="container">
        <!-- সার্চ করার অপশন -->
        <input type="text" id="searchInput" class="search-box" placeholder="নাটক বা সিনেমা খুঁজুন..." onkeyup="searchMovies()">

        <div class="banner" id="bannerText">
            ব্যাচেলর পয়েন্ট সিজন ৫ - নতুন এপিসোড
        </div>

        <div class="section-title" id="secTitle">জনপ্রিয় সিরিজ ও নাটক</div>

        <!-- ভিডিও লিস্ট (এখানেই আপনার ভিডিওগুলো থাকবে) -->
        <div class="grid" id="videoGrid">
            
            <!-- ভিডিও ১ -->
            <div class="card" data-title="নাটক ১ ব্যাচেলর পয়েন্ট comedy">
                <img src="https://via.placeholder.com/300x150" alt="Thumbnail">
                <div class="card-body">
                    <div class="card-title">নাটক ১</div>
                    <div class="card-sub">মজার কমেডি নাটক</div>
                    <!-- এখানে '#' এর জায়গায় আপনার ভিডিওর আসল লিংক বসাবেন -->
                    <a href="https://t.me" target="_blank" class="watch-btn">দেখুন / ডাউনলোড</a>
                </div>
            </div>

            <!-- ভিডিও ২ -->
            <div class="card" data-title="বাংলা সিনেমা সিনেমা ফুল মুভি">
                <img src="https://via.placeholder.com/300x150" alt="Thumbnail">
                <div class="card-body">
                    <div class="card-title">বাংলা সিনেমা</div>
                    <div class="card-sub">লেটেস্ট ব্লকবাস্টার মুভি</div>
                    <!-- এখানে '#' এর জায়গায় আপনার ভিডিওর আসল লিংক বসাবেন -->
                    <a href="https://t.me" target="_blank" class="watch-btn">দেখুন / ডাউনলোড</a>
                </div>
            </div>

        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">🏠 হোম</div>
        <div class="nav-item">🎬 সিরিজ</div>
        <div class="nav-item">📺 টিভি</div>
        <div class="nav-item">❤️ ফেভারিট</div>
        <div class="nav-item">👤 প্রফাইল</div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            if(body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            if(lang === 'en') {
                document.getElementById('appTitle').innerText = 'Movie Hub BD';
                document.getElementById('secTitle').innerText = 'Popular Series & Dramas';
                document.getElementById('searchInput').placeholder = 'Search movies or dramas...';
                document.getElementById('bannerText').innerText = 'Bachelor Point Season 5 - New Episode';
            } else {
                document.getElementById('appTitle').innerText = 'Movie Hub BD';
                document.getElementById('secTitle').innerText = 'জনপ্রিয় সিরিজ ও নাটক';
                document.getElementById('searchInput').placeholder = 'নাটক বা সিনেমা খুঁজুন...';
                document.getElementById('bannerText').innerText = 'ব্যাচেলর পয়েন্ট সিজন ৫ - নতুন এপিসোড';
            }
        }

        // সার্চ করার জাভাস্ক্রিপ্ট ফাংশন
        function searchMovies() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title').toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
