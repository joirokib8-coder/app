<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub BD</title>
    <!-- আপনার মনিট্যাগ বা অ্যাড স্ক্রিপ্ট এখানে যুক্ত করতে পারেন -->
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            padding: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .video-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .video-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .video-title {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>💡 Online Video Hub</span>
        <span style="color: #28a745;">• লাইভ</span>
    </div>

    <input type="text" class="search-box" id="searchInput" placeholder="ভিডিও খুঁজুন..." onkeyup="searchVideos()">

    <h3>জনপ্রিয় ভিডিও তালিকা</h3>
    <div id="videoContainer"></div>

    <script>
        const STORAGE_KEY = 'movieHub_videos_data';

        function loadWebsiteVideos() {
            let container = document.getElementById('videoContainer');
            container.innerHTML = '';
            let videos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            if(videos.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; margin-top:30px;">বর্তমানে কোনো ভিডিও নেই।</p>';
                return;
            }

            videos.forEach((vid) => {
                let card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = function() {
                    playVideoWithAd(vid.videoUrl);
                };
                card.innerHTML = `
                    <img src="${vid.imgSrc}" alt="Thumbnail">
                    <div class="video-title">${vid.title}</div>
                `;
                container.appendChild(card);
            });
        }

        function playVideoWithAd(url) {
            // মনিট্যাগ বা যেকোনো অ্যাড ফাংশন এখানে কল হবে
            if (typeof show_11978077 === 'function') {
                show_11978077().then(() => {
                    window.location.href = url;
                }).catch(() => {
                    window.location.href = url;
                });
            } else {
                // যদি অ্যাড ফাংশন লোড না হয়ে থাকে সরাসরি ভিডিও লিংকে নিয়ে যাবে
                window.location.href = url;
            }
        }

        function searchVideos() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('video-card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByClassName('video-title')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে ভিডিওগুলো দেখাবে
        window.onload = loadWebsiteVideos;
    </script>
</body>
</html>
