<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub BD</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --text-color: #ffffff;
            --card-bg: #1a1c23;
            --accent-color: #e91e63;
            --secondary-text: #b0b0b0;
        }
        [data-theme="light"] {
            --bg-color: #f4f5f7;
            --text-color: #111111;
            --card-bg: #ffffff;
            --accent-color: #e91e63;
            --secondary-text: #666666;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            padding-bottom: 80px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .container {
            padding: 15px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .card-body {
            padding: 10px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-sub {
            font-size: 11px;
            color: var(--secondary-text);
        }

        /* ভিডিও প্লেয়ার মডাল */
        #videoPlayerModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 4000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .player-container {
            width: 100%;
            max-width: 700px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
        }
        .player-container iframe, .player-container video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .close-player {
            background: #e91e63;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 14px;
        }

        /* নেভিগেশন বার */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--secondary-text);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .nav-item span {
            font-size: 20px;
        }
        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo">Movie Hub BD</div>
        <div class="header-controls">
            <button onclick="toggleTheme()">🌓 থিম</button>
        </div>
    </header>

    <div class="container">
        <!-- সার্চ বক্স -->
        <input type="text" id="searchInput" class="search-box" placeholder="নাটক বা সিনেমা খুঁজুন..." onkeyup="searchMovies()">

        <div class="section-title" id="secTitle">জনপ্রিয় সিরিজ ও নাটক</div>

        <!-- ভিডিও গ্রিড লিস্ট -->
        <div class="grid" id="videoGrid"></div>
    </div>

    <!-- ভিডিও প্লেয়ার পপআপ -->
    <div id="videoPlayerModal">
        <div class="player-container" id="playerWrapper"></div>
        <button class="close-player" onclick="closeVideoPlayer()">ভিডিও বন্ধ করুন</button>
    </div>

    <!-- নিচের নেভিগেশন বার -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="filterTab('home', this)"><span>🏠</span>হোম</div>
        <div class="nav-item" onclick="filterTab('drama', this)"><span>🎬</span>সিরিজ</div>
        <div class="nav-item" onclick="filterTab('tv', this)"><span>📺</span>টিভি</div>
        <div class="nav-item" onclick="filterTab('favorite', this)"><span>❤️</span>ফেভারিট</div>
        <div class="nav-item" onclick="filterTab('profile', this)"><span>👤</span>প্রফাইল</div>
    </div>

    <script>
        window.onload = function() {
            loadVideos();
        };

        function loadVideos() {
            let grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            let videos = JSON.parse(localStorage.getItem('movieHubVideos_pro')) || [];

            // যদি কোনো ভিডিও না থাকে তবে স্যাম্পল বা ডেমো দেখাবে
            if(videos.length === 0) {
                videos = [{
                    category: 'drama',
                    title: 'নমুনা নাটক পর্ব ১',
                    sub: 'মজার কমেডি নাটক',
                    imgSrc: 'https://via.placeholder.com/300x150',
                    videoUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
                    adCount: 1,
                    adLink: 'https://example.com'
                }];
            }

            videos.forEach((vid) => {
                let newCard = document.createElement('div');
                newCard.className = 'card';
                newCard.setAttribute('data-category', vid.category);
                newCard.setAttribute('data-title', vid.title.toLowerCase());

                newCard.innerHTML = `
                    <div onclick="handleVideoClick('${vid.videoUrl}', ${vid.adCount}, '${vid.adLink}')">
                        <img src="${vid.imgSrc}" alt="Thumbnail">
                        <div class="card-body">
                            <div class="card-title">${vid.title}</div>
                            <div class="card-sub">${vid.sub}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(newCard);
            });
        }

        // ভিডিওতে ক্লিক করলে অ্যাড ওপেন হবে এবং ভিডিও চলবে
        function handleVideoClick(videoUrl, adCount, adLink) {
            if (adCount > 0 && adLink) {
                for (let i = 0; i < adCount; i++) {
                    window.open(adLink, '_blank');
                }
            }
            openVideoPlayer(videoUrl);
        }

        function openVideoPlayer(url) {
            const playerModal = document.getElementById('videoPlayerModal');
            const wrapper = document.getElementById('playerWrapper');
            let embedHtml = '';
            
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                }
                embedHtml = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } else {
                embedHtml = `<video controls autoplay playsinline><source src="${url}" type="video/mp4"></video>`;
            }
            
            wrapper.innerHTML = embedHtml;
            playerModal.style.display = 'flex';
        }

        function closeVideoPlayer() {
            const playerModal = document.getElementById('videoPlayerModal');
            const wrapper = document.getElementById('playerWrapper');
            wrapper.innerHTML = '';
            playerModal.style.display = 'none';
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function searchMovies() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title').toLowerCase();
                cards[i].style.display = title.includes(input) ? "" : "none";
            }
        }

        function filterTab(type, element) {
            let items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            let cards = document.getElementsByClassName('card');
            let secTitle = document.getElementById('secTitle');

            if(type === 'home') {
                secTitle.innerText = "জনপ্রিয় সিরিজ ও নাটক";
                for(let card of cards) { card.style.display = ""; }
            } else if(type === 'drama') {
                secTitle.innerText = "সিরিজ ও নাটক তালিকা";
                for(let card of cards) {
                    card.style.display = (card.getAttribute('data-category') === 'drama') ? "" : "none";
                }
            } else if(type === 'tv') {
                secTitle.innerText = "টিভি শো ও লাইভ";
                for(let card of cards) {
                    card.style.display = (card.getAttribute('data-category') === 'tv') ? "" : "none";
                }
            } else if(type === 'favorite') {
                alert('ফেভারিট লিস্ট খালি!');
            } else if(type === 'profile') {
                alert('Movie Hub BD প্রফাইল পেজ।');
            }
        }
    </script>
</body>
</html>
